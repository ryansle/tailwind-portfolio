<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 512 512"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <!-- Theme-adaptive favicon. No background tile in either scheme: the glyph
       itself inverts, so it stays legible on light and dark browser chrome.
       Presentation attributes below carry the light-scheme values, so a renderer
       that ignores the <style> block still gets a visible mark. -->
  <style>
    :root { --ink: #020617; --accent: #0D9488; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f8fafc; --accent: #2DD4BF; }
    }
    .ink { fill: var(--ink); stroke: var(--ink); }
    .accent { fill: var(--accent); }
  </style>
